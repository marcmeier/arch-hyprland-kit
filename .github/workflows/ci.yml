name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck, shfmt and ruff
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/
          sudo curl -fsSLo /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt
          pipx install ruff==0.16.9
      - name: Lint
        run: tests/lint.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bats and Pillow
        run: |
          git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pil
      - name: Tests
        run: '"$RUNNER_TEMP/bats/bin/bats" tests/'
