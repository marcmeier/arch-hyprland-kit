# Matches waybar / wlogout / mako / walker. Stock config: hyprlock.conf.bak-default

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/wall.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.45
    contrast = 0.9
    color = rgba(20, 22, 28, 1.0)
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(215, 220, 226, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d. %B %Y'
    color = rgba(107, 114, 128, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = 16
    outline_thickness = 1
    outer_color = rgba(162, 153, 255, 0.55)
    inner_color = rgba(20, 22, 28, 0.85)
    font_color = rgba(215, 220, 226, 1.0)
    font_family = JetBrainsMono Nerd Font
    check_color = rgba(51, 170, 255, 0.9)
    fail_color = rgba(255, 95, 109, 0.9)
    capslock_color = rgba(255, 180, 84, 0.9)
    fade_on_empty = false
    placeholder_text = <span foreground="##6b7280">Password</span>
    fail_text = <span foreground="##ff5f6d">falsch</span>
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    position = 0, -20
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(107, 114, 128, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
}
