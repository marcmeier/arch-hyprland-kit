# Locking goes through the shell's lock screen (quickshell/lock/Lock.qml); scripts/lock falls back to
# hyprlock when the shell does not answer. "loginctl lock-session" (sleep, the timeout) calls lock_cmd.
general {
    lock_cmd = ~/.config/quickshell/scripts/lock
    before_sleep_cmd = loginctl lock-session
}
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
