# waybar.service comes with the waybar package. The kit's bar is the desktop shell now
# (driftless-shell.service): Waybar does not start where the shell is linked. The sync switches the
# unit off for good (user-unit-retired in the manifest); this keeps a sync that still runs older code
# from starting a bare Waybar in between.
[Unit]
ConditionPathExists=!%h/.config/quickshell
