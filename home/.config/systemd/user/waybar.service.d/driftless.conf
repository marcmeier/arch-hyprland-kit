# waybar.service comes with waybar. driftless renders this machine's bar config first (render.py:
# compact bar on narrow outputs, the widget layout of this machine) and starts waybar with it.
[Service]
ExecStartPre=%h/.config/waybar/render.py
ExecStart=
ExecStart=/usr/bin/waybar -c %h/.cache/waybar/config.jsonc -s %h/.config/waybar/style.css
