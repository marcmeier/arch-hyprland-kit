# Matches the bar / ghostty: the accents of the wallpaper, dim details; dark or light look.
add_newline = false
command_timeout = 500

format = """
$username$hostname$directory$git_branch$git_status$python$rust$golang$cmd_duration$jobs
$character"""

[character]
success_symbol = "[❯](bold @secondary@)"
error_symbol   = "[❯](bold @red@)"

[directory]
style = "bold @primary@"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "@orange@"

[git_branch]
symbol = " "
format = "[on](@muted@) [$symbol$branch]($style) "
style = "@secondary@"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "@orange@"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
modified = "!"
staged = "+"
untracked = "?"
stashed = "$"
deleted = "✘"

[cmd_duration]
min_time = 3000
format = "[took $duration]($style) "
style = "@muted@"

[jobs]
symbol = "✦"
style = "@purple@"

[username]
format = "[$user]($style)@"
style_user = "@muted@"
style_root = "bold @red@"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "@muted@"

[python]
format = "[py $version]($style) "
style = "@muted@"

[rust]
format = "[rs $version]($style) "
style = "@muted@"

[golang]
format = "[go $version]($style) "
style = "@muted@"
