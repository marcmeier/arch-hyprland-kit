# shellcheck shell=bash
# Personal settings of this kit, read by snapshot.sh, auto-snapshot.sh, restore.sh and verify.sh.

# Notes folder (relative to the home directory) that travels with the kit as files/CLAUDE.md and
# files/docs/, e.g. "Notes/system". Empty: no notes are synced.
KIT_NOTES_REL=""

# Zip copy of the whole kit, refreshed by the sync whenever the kit changed (e.g. into a cloud
# folder, for a USB stick or a machine without git access). Empty: no zip.
KIT_ZIP=""
