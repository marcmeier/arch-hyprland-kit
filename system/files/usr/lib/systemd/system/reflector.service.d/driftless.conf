# driftless: fast HTTPS mirrors. Countries are personal: REFLECTOR_COUNTRY in /etc/driftless/reflector
# (written by install/bootstrap.sh from personal/config), e.g. REFLECTOR_COUNTRY=Germany,Austria
[Service]
EnvironmentFile=-/etc/driftless/reflector
ExecStart=
ExecStart=/usr/bin/sh -c 'exec /usr/bin/reflector --save /etc/pacman.d/mirrorlist --protocol https --latest 20 --sort rate $${REFLECTOR_COUNTRY:+--country "$$REFLECTOR_COUNTRY"}'
