# driftless: the Quickshell greeter in cage, ReGreet as its fallback (/usr/lib/driftless/greeter). The
# files they read are rendered per machine in /var/lib/driftless/greeter (hostname, wallpaper, colours,
# avatar, the last user) by /usr/lib/driftless/greeter-update.
[terminal]
vt = 1

[default_session]
command = "/usr/lib/driftless/greeter"
user = "greeter"
